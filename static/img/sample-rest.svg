<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d251e"/>
      <stop offset="100%" stop-color="#191410"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#warmGrad)"/>
  <!-- Subtle wood / forest floor textures -->
  <circle cx="400" cy="270" r="180" fill="#3d3227" opacity="0.4"/>
  <!-- Resting dog shape -->
  <g transform="translate(250, 200)" fill="#443224">
    <ellipse cx="150" cy="110" rx="140" ry="60"/>
    <ellipse cx="70" cy="90" rx="55" ry="45"/>
    <ellipse cx="40" cy="110" rx="35" ry="25" fill="#2d2016"/>
    <!-- Calm ear resting -->
    <path d="M60 70 C50 100, 70 120, 85 110 Z" fill="#231810"/>
  </g>
  <text x="40" y="440" fill="#f5f0eb" font-family="system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="1">NEUROTYP &amp; STABILITA</text>
  <text x="40" y="468" fill="#d8cfc4" font-family="system-ui, sans-serif" font-size="16">Schopnost hlubokého odpočinku a přepnutí z maximálního výkonu</text>
</svg>

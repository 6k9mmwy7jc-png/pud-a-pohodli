<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3f4d"/>
      <stop offset="50%" stop-color="#1e2c35"/>
      <stop offset="100%" stop-color="#121a20"/>
    </linearGradient>
    <linearGradient id="reedGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2d3319"/>
      <stop offset="100%" stop-color="#737946"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#3b4d57"/>
  <rect y="240" width="800" height="260" fill="url(#waterGrad)"/>
  <!-- Reeds in background -->
  <g stroke="url(#reedGrad)" stroke-width="4" stroke-linecap="round">
    <line x1="40" y1="500" x2="60" y2="160"/>
    <line x1="70" y1="500" x2="80" y2="190"/>
    <line x1="90" y1="500" x2="110" y2="140"/>
    <line x1="130" y1="500" x2="135" y2="200"/>
    <line x1="680" y1="500" x2="660" y2="150"/>
    <line x1="710" y1="500" x2="700" y2="180"/>
    <line x1="740" y1="500" x2="725" y2="130"/>
    <line x1="770" y1="500" x2="760" y2="170"/>
  </g>
  <!-- Water ripples -->
  <ellipse cx="400" cy="380" rx="220" ry="25" fill="none" stroke="#5d7b8d" stroke-width="2" opacity="0.6"/>
  <ellipse cx="400" cy="380" rx="140" ry="15" fill="none" stroke="#7e9eaf" stroke-width="2" opacity="0.8"/>
  <!-- Swimming dog profile -->
  <g transform="translate(360, 310) scale(0.7)" fill="#2e2219">
    <ellipse cx="60" cy="65" rx="55" ry="30"/>
    <path d="M70 45 C75 15, 120 10, 145 35 C155 45, 150 70, 130 85 C100 85, 75 80, 70 45 Z"/>
    <circle cx="115" cy="40" r="4" fill="#d8cfc4"/>
  </g>
  <text x="40" y="450" fill="#f5f0eb" font-family="system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="1">VODA &amp; PŘINÁŠENÍ</text>
  <text x="40" y="475" fill="#d8cfc4" font-family="system-ui, sans-serif" font-size="16">Neústupná chuť do hluboké vody a rákosí</text>
</svg>
